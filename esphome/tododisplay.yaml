    pin: GPIO39
    enable_time: 210ms      # Einschwingzeit des NS4150B nach Enable, ggf. anpassen
    keep_on_time: 80ms    # wie lange nach dem letzten Ton noch an bleibt
    
## ------- I2S BUS SETTINGS -------
i2s_audio:
