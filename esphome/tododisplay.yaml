sd_mmc_card:
  id: display_sd
  mode_1bit: false
  clk_pin: GPIO16    # SD_CLK
  cmd_pin: GPIO17    # SD_MOSI
  data0_pin: GPIO15  # SD_MISO
  data1_pin: GPIO7   # SD_D1
  data2_pin: GPIO8   # SD_D2
  data3_pin: GPIO18  # SD_CS

