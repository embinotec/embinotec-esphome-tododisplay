## ------- POWER MANGEMENT -------
## ESP32 should be powered by three times 2800mAh rechargable AA batteries.
## To save some power the ESP should not always be connected to your wifi and have some rest
## to cover the hole day with measurements.
deep_sleep:
  id: during_day
  run_duration: 2min
  sleep_duration: 13min
  esp32_ext1_wakeup: 
    mode: ANY_LOW
    pins: 
        - pin: 
            number: GPIO4 ## JOG-UP
         #   allow_other_uses: true
          on_wake:
            then:
              - logger.log: "awake"
        - pin: 
            number: GPIO5   ## JOG-PUSH
          #  allow_other_uses: true
          on_wake:
            then:
              - logger.log: "awake"
        - pin: 
            number: GPIO6  ## JOG-DOWN
          #  allow_other_uses: true
          on_wake:
            then:
              - logger.log: "awake"
  #- id: during_night
  #  run_duration: 5min
  #  sleep_duration: 30min



