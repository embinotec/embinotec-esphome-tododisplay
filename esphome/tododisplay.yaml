      // Confirmation Popup
      /// -------------------------
       if (id(confirmation_active)) {
         it.fill(WHITE);
         int cx = 40, cy = it.get_height() / 2;

         int fw = 0, fx = 0, fb = 0, fh = 0;
         id(font_title)->measure("Test", &fw, &fx, &fb, &fh);   // Zeilenhöhe der Schrift
         
         // Haken aus zwei Linien: kurzer Strich runter-rechts, langer Strich rauf-rechts
         it.line(cx,      cy + 10, cx + 12, cy + 22, BLACK);
         it.line(cx + 12, cy + 22, cx + 34, cy - 14, BLACK);
         
         // Zwei Zeilen untereinander, vertikal um cy zentriert
         it.print(cx + 50, cy - fh, id(font_title), BLACK, id(confirmation_text).c_str());
         it.print(cx + 50, cy,      id(font_title), BLACK, "entnommen");
         
         return;
       }
      
      // -----------------------------
      // Header
      // -----------------------------
      it.print(0, 0, id(font_title), BLACK, "${display_title}");
      
      it.line(3, 40, it.get_width(), 40,BLACK);

       // -----------------------------
       // WiFi-Icon oben rechts
       // -----------------------------
       bool wifi_ok = id(wifi_comp).is_connected();
       int wifi_rssi = wifi_ok ? (int) id(wifi_signal_sensor).state : -100;
       init_sequence_id: 
       int bars = 0;
       if (wifi_rssi > -55) bars = 4;
       else if (wifi_rssi > -65) bars = 3;
       else if (wifi_rssi > -75) bars = 2;
       else if (wifi_rssi > -85) bars = 1;
    
       int bar_w = 8, bar_gap = 3, bar_x0 = it.get_width() - 4 * (bar_w + bar_gap) - 10;
       int base_y = 32;
    
       if (!wifi_ok) {
         // Kein WLAN Kreuz statt Balken
         it.line(bar_x0, base_y - 20, bar_x0 + 24, base_y, BLACK);
         it.line(bar_x0, base_y, bar_x0 + 24, base_y - 20, BLACK);
       } else {
         for (int b = 0; b < 4; b++) {
           int h = 6 + b * 5;              // steigende Balkenhöhe
           int x = bar_x0 + b * (bar_w + bar_gap);
           if (b < bars) {
             it.filled_rectangle(x, base_y - h, bar_w, h, BLACK);
           } else {
             it.rectangle(x, base_y - h, bar_w, h, BLACK);   // nur Umriss = "leerer" Balken
           }
         }
       }
 
      // -----------------------------
      // SD-Karten-Status-Icon
      // -----------------------------
      
      int sd_x = it.get_width() - 4 * (bar_w + bar_gap) - 50, sd_y = 5;
      int icon_w = 0, icon_x_off = 0, icon_baseline = 0, icon_h = 0;
      id(font_icons)->measure("\U000F07DC", &icon_w, &icon_x_off, &icon_baseline, &icon_h);

      bool sd_ok = !id(display_sd).is_failed();
      
      if (sd_ok) {
        it.print(sd_x, sd_y, id(font_icons), BLACK, "\U000F07DC");
      } else {
        // Invertiert statt durchgestrichen: schwarzer Kasten + weißes Icon, gut erkennbar
        it.filled_rectangle(sd_x - 2, sd_y - 2, icon_w + 4, icon_h + 4, BLACK);
        it.print(sd_x, sd_y, id(font_icons), WHITE, "\U000F07DC");
      }
      /*
      it.print(sd_x, sd_y, id(font_icons), BLACK, "\U000F07DC");
      
      if (id(display_sd).is_failed()) {
      // Kreuz über das Icon zeichnen, wenn keine SD erkannt/Mount fehlgeschlagen
      it.line(sd_x,      sd_y,      sd_x + 24, sd_y + 24, BLACK);
      it.line(sd_x,      sd_y + 24, sd_x + 24, sd_y,      BLACK);
      }
      */
      // -----------------------------
      // Tabellen-Überschrift
      // -----------------------------
      it.print(4, 44, id(date), BLACK, "Essen");
      it.print(it.get_width() - 60, 44, id(date), BLACK, "Seit");
      it.line(3, 68, it.get_width(), 68, BLACK);

      // -----------------------------
      // Todo-Liste
      // -----------------------------
      std::string items = id(ha_todo_list).state;
      
      int y = 74;
      int item_count = 0;
      int item_font_width = 0;
      int item_font_x_offset = 0;
      int item_font_baseline = 0;
      int item_font_height = 0;
      id(font_item)->measure("Test", &item_font_width, &item_font_x_offset, &item_font_baseline, &item_font_height);
      size_t start = 0;

      int desc_font_width = 0, desc_font_x_offset = 0, desc_font_baseline = 0, desc_font_height = 0;
      id(font_desc)->measure("Test", &desc_font_width, &desc_font_x_offset, &desc_font_baseline, &desc_font_height);

      
      // -----------------------------
      // Nach Fälligkeitsdatum sortieren, älteste zuerst
      // (Items ohne Datum ans Ende) — einfacher Insertion-Sort,
      // stabil, keine zusätzlichen Includes nötig
      // -----------------------------
      {
        int cnt2 = (int) id(item_uids).size();
        for (int i = 1; i < cnt2; i++) {
          std::string key_uid = id(item_uids)[i];
          std::string key_sum = id(item_summaries)[i];
          std::string key_due = id(item_dues)[i];
          std::string key_sort = key_due.empty() ? "9999-99-99" : key_due;
    
          int j = i - 1;
          while (j >= 0) {
            std::string cur_due = id(item_dues)[j].empty() ? "9999-99-99" : id(item_dues)[j];
            if (cur_due <= key_sort) break;
            id(item_uids)[j + 1]      = id(item_uids)[j];
            id(item_summaries)[j + 1] = id(item_summaries)[j];
            id(item_dues)[j + 1]      = id(item_dues)[j];
            j--;
          }
          id(item_uids)[j + 1]      = key_uid;
          id(item_summaries)[j + 1] = key_sum;
          id(item_dues)[j + 1]      = key_due;
        }
      }
      
      int cnt = (int) id(item_summaries).size();
 
      if (cnt == 0) {
        it.print(0, y, id(font_item), BLACK, "Keine Reste");
      }
 
      for (int index = 0; index < cnt; index++) {
        bool selected = (index == id(selected_index));
      
        std::string desc = id(item_descriptions)[index];
        bool has_desc = !desc.empty();
        if (desc.length() > 35) {
          desc = desc.substr(0, 32) + "...";   // max. 35 Zeichen inkl. "..."
        }
      
        int row_height = item_font_height + (has_desc ? desc_font_height : 0);
      
        if (selected) {
          it.filled_rectangle(0, y - 2, it.get_width(), row_height, BLACK);
          it.print(4, y, id(font_item), WHITE, id(item_summaries)[index].c_str());
        } else {
          it.print(4, y, id(font_item), BLACK, id(item_summaries)[index].c_str());
        }
      
        std::string due = id(item_dues)[index];
        if (due.length() >= 10) {
          std::string date = due.substr(8, 2) + "." + due.substr(5, 2) + ".";
          it.print(it.get_width() - 60, y, id(font_item), selected ? WHITE : BLACK, date.c_str());
        }
      
        if (has_desc) {
          it.print(20, y + item_font_height, id(font_desc), selected ? WHITE : BLACK, desc.c_str());
        }
      
        y += row_height;
      }

      // -----------------------------
      // Footer: Trennlinie, links Firmware-Version, rechts Temperatur
      // -----------------------------
      int footer_y = it.get_height() - desc_font_height - 10;   // desc_font_height ist weiter oben schon gemessen
      it.line(3, footer_y, it.get_width(), footer_y, BLACK);
      
      it.print(4, footer_y + 4, id(font_desc), BLACK, "${firmware_version}");
      
      float temperature = id(ambient_temp).state;
      if (std::isnan(temperature)) {
        it.print(it.get_width() - 4, footer_y + 4, id(font_desc), BLACK, TextAlign::TOP_RIGHT, "--,- °C");
      } else {
        it.printf(it.get_width() - 4, footer_y + 4, id(font_desc), BLACK, TextAlign::TOP_RIGHT, "%.1f °C", temperature);
      }

  
