# --- Todo-Text aus Home Assistant holen ---
# Erwartet: ${ha_sensor_entity} mit Attribut "list" (siehe HA-Config unten)
text_sensor:
  - platform: homeassistant
    id: ha_todo_list
    name: "Todo Rohdaten (Debug)"   ## For testing only, remove before release
    entity_id: ${ha_sensor_entity}
    attribute: list

    on_value:
      then:
        - logger.log: 
            format: "todo-Rohdaten empfangen '%s'"
            args: ['id(ha_todo_list).state.c_str()']
        - lambda: |-
            id(item_uids).clear();
            id(item_summaries).clear();
            id(item_dues).clear();
            id(item_descriptions).clear();
 
            std::string data = id(ha_todo_list).state;
            size_t start = 0;
            while (start < data.size()) {
              size_t pos = data.find('\n', start);
              std::string line = (pos == std::string::npos)
                                    ? data.substr(start)
                                    : data.substr(start, pos - start);
              if (!line.empty()) {
                size_t p1 = line.find('|');
                size_t p2 = (p1 == std::string::npos) ? std::string::npos : line.find('|', p1 + 1);
                size_t p3 = (p2 == std::string::npos) ? std::string::npos : line.find('|', p2 + 1);
                /*
                std::string uid     = (p1 != std::string::npos) ? line.substr(0, p1) : "";
                std::string summary = (p1 != std::string::npos)
                    ? ((p2 != std::string::npos) ? line.substr(p1 + 1, p2 - p1 - 1) : line.substr(p1 + 1))
                    : line;
                std::string due     = (p2 != std::string::npos) ? line.substr(p2 + 1) : "";
                 */
                std::string uid     = (p1 != std::string::npos) ? line.substr(0, p1) : "";
                std::string summary = (p1 != std::string::npos) ? ((p2 != std::string::npos) ? line.substr(p1 + 1, p2 - p1 - 1) : line.substr(p1 + 1)) : line;
                std::string due         = (p2 != std::string::npos) ? ((p3 != std::string::npos) ? line.substr(p2 + 1, p3 - p2 - 1) : line.substr(p2 + 1)): "";
                std::string description = (p3 != std::string::npos) ? line.substr(p3 + 1) : "";
                
                id(item_uids).push_back(uid);
                id(item_summaries).push_back(summary);
                id(item_dues).push_back(due);
                id(item_descriptions).push_back(description);
              }
              if (pos == std::string::npos) break;
              start = pos + 1;
            }
 
            // Auswahl im gültigen Bereich halten (z.B. nach Abhaken/Änderung der Liste)
            int cnt = (int) id(item_uids).size();
            if (cnt == 0) {
              id(selected_index) = 0;
            } else if (id(selected_index) >= cnt) {
              id(selected_index) = cnt - 1;
            }
        - delay: 1s
        - component.update: eink_display


binary_sensor:
  ## BOOT
  - platform: gpio
    pin: GPIO0
    name: "User button"
    id: user_button
    
  ## Jog -up
  - platform: template #gpio
    id: up
    #name: "up"
    ## either template with lambda and filter, or gpio with pin
    lambda: 'return gpio_get_level(GPIO_NUM_4) == 0;'
    filters:
      - delayed_on_off: 25ms
    #pin:
    #  number: GPIO4
    #  inverted: true
     # mode: INPUT_PULLUP
      #allow_other_uses: true
    on_press:
      then:
        - lambda: |-
            int cnt = (int) id(item_uids).size();
            if (cnt > 0) id(selected_index) = (id(selected_index) - 1 + cnt) % cnt;
        - component.update: eink_display
          
  ## Jog - push
  - platform: template #gpio
    id: push
    #name: "push"
    lambda: 'return gpio_get_level(GPIO_NUM_5) == 0;'
    filters:
      - delayed_on_off: 25ms
    #pin:
    #  number: GPIO5
    #  inverted: true
     # allow_other_uses: true
     # mode: INPUT_PULLUP
    on_multi_click:
      - timing:
          - ON for at least 3000ms
        then:
          - lambda: |-
              int cnt = (int) id(item_uids).size();
              if (cnt > 0 && id(selected_index) < cnt) {
                id(pending_uid) = id(item_uids)[id(selected_index)];
                id(confirmation_text) = id(item_summaries)[id(selected_index)];
                //id(confirmation_text) = id(item_summaries)[id(selected_index)] + "\n" + "entnommen";
               // id(confirmation_text) = "\\u221A" + " " + id(item_summaries)[id(selected_index)] + " " + "entnommen.";
              } else {
                id(pending_uid) = "";
              }
          - if:
              condition:
                lambda: 'return !id(pending_uid).empty();'
              then:
                - homeassistant.action:
                    action: todo.update_item
                    data:
                      entity_id: ${todo_entity}
                      item: !lambda 'return id(pending_uid);'
                      status: "completed"
                - lambda: 'id(confirmation_active) = true;'
                - component.update: eink_display
                - delay: 3s
                - lambda: 'id(confirmation_active) = false;'
                - component.update: eink_display
## alternative function
