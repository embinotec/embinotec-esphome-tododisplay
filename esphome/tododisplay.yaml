## --- e-Paper Display ------
## 3.97" with SSD1677
## https://docs.waveshare.com/ESP32-S3-ePaper-3.97/Resources-And-Documents
display:
  - platform: epaper_spi
    id: eink_display
    model: SSD1677
    full_update_every: 20
    update_interval: 45s   ## 30s display test, never@update by HA
    spi_id: epd_spi
    dimensions:
      width: 800
      height: 480
    transform:
      mirror_x: true
      mirror_y: false
    rotation: 90 # Rotate to portrait
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO46
#   reset_duration: 500ms
    busy_pin: { number: GPIO3, inverted: false, mode: { input: True, pulldown: True } }
  
    lambda: |-
      auto WHITE = Color(255, 255, 255);  // level 3
      auto LIGHT = Color(170, 170, 170);  // level 2
      auto DARK  = Color(85, 85, 85);     // level 1
      auto BLACK = Color(0, 0, 0);        // level 0

      const int vspace = 2;
      
      /// --------------
      // TEST
      // ---------------
      //it.fill(WHITE);                       // Hintergrund weiß
      //it.print(20, 20, id(font_title), BLACK, "Hello World!");
      //it.rectangle(0, 0, it.get_width() - 1, it.get_height() - 1);
      
      // -----------------------------
      // Confirmation Popup
      // -----------------------------
      if (id(confirmation_active)) {
        it.fill(WHITE);
        int popup_x = 40;
        int popup_y = it.get_height() / 2;

        int popup_font_width = 0, popup_font_x_offset = 0, popup_font_baseline = 0, popup_font_height = 0;
        id(font_title)->measure("Test", &popup_font_width, &popup_font_x_offset, &popup_font_baseline, &popup_font_height);

        // Haken aus zwei Linien: kurzer Strich runter-rechts, langer Strich rauf-rechts
        it.line(popup_x,      popup_y + 10, popup_x + 12, popup_y + 22, BLACK);
        it.line(popup_x + 12, popup_y + 22, popup_x + 34, popup_y - 14, BLACK);

        // Zwei Zeilen untereinander, vertikal um popup_y zentriert
        it.print(popup_x + 50, popup_y - popup_font_height, id(font_title), BLACK, id(confirmation_text).c_str());
        it.print(popup_x + 50, popup_y, id(font_title), BLACK, "entnommen");
        return;
      }

      // -----------------------------
      // TITLE
      // -----------------------------
      it.print(0, 0, id(font_title), BLACK, "${display_title}");
      it.line(3, 40, it.get_width(), 40, BLACK);

      // -----------------------------
      // WiFi-Icon oben rechts
      // -----------------------------
      bool wifi_connected = id(wifi_comp).is_connected();
      int wifi_rssi = -100;
      if (wifi_connected && !std::isnan(id(wifi_signal_sensor).state)) {
        wifi_rssi = (int) id(wifi_signal_sensor).state;
      }
      int wifi_bars = 0;
      if (wifi_rssi > -55) wifi_bars = 4;
      else if (wifi_rssi > -65) wifi_bars = 3;
      else if (wifi_rssi > -75) wifi_bars = 2;
      else if (wifi_rssi > -85) wifi_bars = 1;

      int bar_width = 8;
      int bar_gap = 3;
      int bar_origin_x = it.get_width() - 4 * (bar_width + bar_gap) - 10;
      int bar_baseline_y = 32;

      if (!wifi_connected) {
        // Kein WLAN: Kreuz statt Balken
        it.line(bar_origin_x, bar_baseline_y - 20, bar_origin_x + 24, bar_baseline_y, BLACK);
        it.line(bar_origin_x, bar_baseline_y, bar_origin_x + 24, bar_baseline_y - 20, BLACK);
      } else {
        for (int bar_index = 0; bar_index < 4; bar_index++) {
          int bar_height = 6 + bar_index * 5;   // steigende Balkenhöhe
          int bar_x = bar_origin_x + bar_index * (bar_width + bar_gap);
          if (bar_index < wifi_bars) {
            it.filled_rectangle(bar_x, bar_baseline_y - bar_height, bar_width, bar_height, BLACK);
          } else {
            it.rectangle(bar_x, bar_baseline_y - bar_height, bar_width, bar_height, BLACK);   // nur Umriss = "leerer" Balken
          }
        }
      }

      // -----------------------------
      // SD-Karten-Status-Icon
      // -----------------------------
      int sd_icon_x = it.get_width() - 4 * (bar_width + bar_gap) - 50;
      int sd_icon_y = 5;
      int icon_width = 0, icon_x_offset = 0, icon_baseline = 0, icon_height = 0;
      id(font_icons)->measure("\U000F07DC", &icon_width, &icon_x_offset, &icon_baseline, &icon_height);

      bool sd_card_ok = !id(display_sd).is_failed();
      if (sd_card_ok) {
        it.print(sd_icon_x, sd_icon_y, id(font_icons), BLACK, "\U000F07DC");
      } else {
        // Invertiert: schwarzer Kasten + weißes Icon, gut erkennbar
        it.filled_rectangle(sd_icon_x - 2, sd_icon_y - 2, icon_width + 4, icon_height + 4, BLACK);
        it.print(sd_icon_x, sd_icon_y, id(font_icons), WHITE, "\U000F07DC");
      }

      // -----------------------------
      // Batterie-Anzeige (links neben dem SD-Icon)
      // -----------------------------
      {
        float voltage_volts = id(battery_voltage).state;
        if (voltage_volts > 100.0f) voltage_volts /= 1000.0f;   // falls die Komponente mV liefert
        float level_percent = id(battery_level).state;
        bool is_charging = id(battery_charging).state;

        const char *battery_icon;
        bool show_percentage = false;

        if (std::isnan(voltage_volts)) {
          battery_icon = "\U000F0091";                 // noch kein Messwert
        } else if (voltage_volts < 2.5f) {
          battery_icon = "\U000F125D";                 // kein Akku erkannt
        } else {
          static const char *const icons_discharging[11] = {
            "\U000F0083", "\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D", "\U000F007E",
            "\U000F007F", "\U000F0080", "\U000F0081", "\U000F0082", "\U000F0079"};
          static const char *const icons_charging[11] = {
            "\U000F089F", "\U000F089C", "\U000F0086", "\U000F0087", "\U000F0088", "\U000F089D",
            "\U000F0089", "\U000F089E", "\U000F008A", "\U000F008B", "\U000F0085"};
          int icon_index = std::isnan(level_percent) ? 0 : (int) ((level_percent + 5.0f) / 10.0f);   // 0..10
          if (icon_index < 0) icon_index = 0;
          if (icon_index > 10) icon_index = 10;
          battery_icon = is_charging ? icons_charging[icon_index] : icons_discharging[icon_index];
          show_percentage = !std::isnan(level_percent);
        }

        int battery_icon_x = sd_icon_x - 40;
        it.print(battery_icon_x, 5, id(font_icons), BLACK, battery_icon);
        if (show_percentage) {
          it.printf(battery_icon_x - 4, 10, id(font_desc), BLACK, TextAlign::TOP_RIGHT, "%.0f%%", level_percent);
        }
      }

      // -----------------------------
      // Tabellen-Überschrift (HEADER)
      // -----------------------------
      it.print(4, 44, id(date), BLACK, "${col_left}");
      it.print(it.get_width() - 60, 44, id(date), BLACK, "${col_right}");
      it.line(3, 68, it.get_width(), 68, BLACK);

      // -----------------------------
      // Todo-Liste mit Scroll-Fenster
      // (die Liste ist bereits sortiert, siehe on_value des Text-Sensors)
      // -----------------------------
      int item_font_width = 0, item_font_x_offset = 0, item_font_baseline = 0, item_font_height = 0;
      id(font_item)->measure("Test", &item_font_width, &item_font_x_offset, &item_font_baseline, &item_font_height);

      int desc_font_width = 0, desc_font_x_offset = 0, desc_font_baseline = 0, desc_font_height = 0;
      id(font_desc)->measure("Test", &desc_font_width, &desc_font_x_offset, &desc_font_baseline, &desc_font_height);

      int list_top = 74;
      int footer_y = it.get_height() - desc_font_height - 10;
      int list_bottom = footer_y - 4;               // Liste endet kurz über der Footer-Linie

      const int entry_count = (int) id(item_summaries).size();

      // Zeilenhöhe eines Eintrags: Titelzeile plus optional Beschreibungszeile
      auto row_height_of = [&](int entry_index) {
        int height_value = item_font_height;
        if (!id(item_descriptions)[entry_index].empty()) height_value += desc_font_height;
        return height_value;
      };

      // Auswahl im gültigen Bereich halten
      int selected_entry = id(selected_index);
      if (selected_entry >= entry_count) selected_entry = entry_count - 1;
      if (selected_entry < 0) selected_entry = 0;

      // Erster sichtbarer Eintrag, sodass die Auswahl immer im Bild bleibt
      int first_visible = 0;
      if (entry_count > 0) {
        int used_height = 0;
        for (int entry_index = 0; entry_index <= selected_entry; entry_index++) {
          used_height += row_height_of(entry_index);
        }
        while (first_visible < selected_entry && used_height > (list_bottom - list_top)) {
          used_height -= row_height_of(first_visible);
          first_visible++;
        }
      }

      int row_y = list_top;
      int last_visible = first_visible - 1;

      if (entry_count == 0) {
        it.print(0, list_top, id(font_item), BLACK, "${empty_text}");
      }

      for (int entry_index = first_visible; entry_index < entry_count; entry_index++) {
        int row_height = row_height_of(entry_index);
        if (row_y + row_height > list_bottom) break;   // nichts zeichnen, was nicht mehr passt

        bool is_selected = (entry_index == selected_entry);
        Color text_color = is_selected ? WHITE : BLACK;

        std::string description = id(item_descriptions)[entry_index];
        bool has_description = !description.empty();
        if (description.length() > 35) {
          // an einer UTF-8-Zeichengrenze kürzen, damit Umlaute nicht zerschnitten werden
          size_t cut_position = 32;
          while (cut_position > 0 && (static_cast<unsigned char>(description[cut_position]) & 0xC0) == 0x80) {
            cut_position--;
          }
          description = description.substr(0, cut_position) + "...";
        }

        if (is_selected) {
          it.filled_rectangle(0, row_y - 2, it.get_width(), row_height, BLACK);
        }
        it.print(4, row_y, id(font_item), text_color, id(item_summaries)[entry_index].c_str());

        std::string due_text = id(item_dues)[entry_index];
        if (due_text.length() >= 10) {
          std::string due_label = due_text.substr(8, 2) + "." + due_text.substr(5, 2) + ".";
          it.print(it.get_width() - 60, row_y, id(font_item), text_color, due_label.c_str());
        }

        if (has_description) {
          it.print(20, row_y + item_font_height, id(font_desc), text_color, description.c_str());
        }

        row_y += row_height;
        last_visible = entry_index;
      }

      // -----------------------------
      // Footer: Trennlinie, links Firmware-Version, Mitte Position, rechts Temperatur
      // -----------------------------
      it.line(3, footer_y, it.get_width(), footer_y, BLACK);

      // ------ Firmware version ------
      it.print(4, footer_y + 4, id(font_desc), BLACK, "${firmware_version}");

      // ------ Position in der Liste (nur wenn nicht alles auf das Display passt) ------
      if (first_visible > 0 || last_visible < entry_count - 1) {
        it.printf(it.get_width() / 2, footer_y + 4, id(font_desc), BLACK,
                  TextAlign::TOP_CENTER, "%d/%d", selected_entry + 1, entry_count);
      }

      // ------ Ambient Temperature ------
      float temperature = id(ambient_temp).state;
      if (std::isnan(temperature)) {
        it.print(it.get_width() - 4, footer_y + 4, id(font_desc), BLACK, TextAlign::TOP_RIGHT, "--,- °C");
      } else {
        it.printf(it.get_width() - 4, footer_y + 4, id(font_desc), BLACK, TextAlign::TOP_RIGHT, "%.1f °C", temperature);
      }

  
