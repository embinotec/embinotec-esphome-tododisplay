    mosi_pin: GPIO12

   
## ------ I2C SETTINGS ----------
## DO NOT CHANGE !!!
## I2C is an IC to IC connection to read for instance digital values from sensors.
i2c:
  - id: bus_a
    sda: GPIO41
    scl:
      number: GPIO42
    frequency: 100kHz
    scan: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

