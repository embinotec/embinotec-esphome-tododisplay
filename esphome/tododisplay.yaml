# --- Todo-Text aus Home Assistant holen ---
# Erwartet: ${ha_sensor_entity} mit Attribut "list" (siehe HA-Config unten)
text_sensor:
  - platform: homeassistant
    id: ha_todo_list
    name: "Todo Rohdaten (Debug)"   ## For testing only, remove before release
    entity_id: ${ha_sensor_entity}
    attribute: list

    on_value:
      then:
        - logger.log: 
            format: "todo-Rohdaten empfangen '%s'"
            args: ['id(ha_todo_list).state.c_str()']
        - lambda: |-
            id(item_uids).clear();
            id(item_summaries).clear();
            id(item_dues).clear();
            id(item_descriptions).clear();
 
                // --- Rohdaten zeilenweise zerlegen: uid|summary|due|description ---
            std::string raw_data = id(ha_todo_list).state;
            size_t line_start = 0;
            while (line_start < raw_data.size()) {
              size_t line_end = raw_data.find('\n', line_start);
              std::string line = (line_end == std::string::npos)
                                    ? raw_data.substr(line_start)
                                    : raw_data.substr(line_start, line_end - line_start);
              if (!line.empty()) {
                size_t first_separator  = line.find('|');
                size_t second_separator = (first_separator == std::string::npos)
                                              ? std::string::npos : line.find('|', first_separator + 1);
                size_t third_separator  = (second_separator == std::string::npos)
                                              ? std::string::npos : line.find('|', second_separator + 1);

                std::string entry_uid = (first_separator != std::string::npos) ? line.substr(0, first_separator) : "";
                std::string entry_summary = (first_separator != std::string::npos)
                    ? ((second_separator != std::string::npos)
                          ? line.substr(first_separator + 1, second_separator - first_separator - 1)
                          : line.substr(first_separator + 1))
                    : line;
                std::string entry_due = (second_separator != std::string::npos)
                    ? ((third_separator != std::string::npos)
                          ? line.substr(second_separator + 1, third_separator - second_separator - 1)
                          : line.substr(second_separator + 1))
                    : "";
                std::string entry_description = (third_separator != std::string::npos)
                    ? line.substr(third_separator + 1) : "";

                id(item_uids).push_back(entry_uid);
                id(item_summaries).push_back(entry_summary);
                id(item_dues).push_back(entry_due);
                id(item_descriptions).push_back(entry_description);
              }
              if (line_end == std::string::npos) break;
              line_start = line_end + 1;
            }

            // --- Nach Fälligkeitsdatum sortieren, älteste zuerst (ohne Datum ans Ende) ---
            // Insertion-Sort: stabil, braucht keine zusätzlichen Includes.
            // Alle vier Listen werden gemeinsam verschoben, damit Beschreibung und UID
            // immer zum richtigen Eintrag gehören.
            const int entry_total = (int) id(item_uids).size();
            for (int outer_index = 1; outer_index < entry_total; outer_index++) {
              std::string current_uid = id(item_uids)[outer_index];
              std::string current_summary = id(item_summaries)[outer_index];
              std::string current_due = id(item_dues)[outer_index];
              std::string current_description = id(item_descriptions)[outer_index];
              std::string current_sort_key = current_due.empty() ? "9999-99-99" : current_due;

              int compare_index = outer_index - 1;
              while (compare_index >= 0) {
                std::string compare_sort_key = id(item_dues)[compare_index].empty()
                                                   ? "9999-99-99" : id(item_dues)[compare_index];
                if (compare_sort_key <= current_sort_key) break;
                id(item_uids)[compare_index + 1]         = id(item_uids)[compare_index];
                id(item_summaries)[compare_index + 1]    = id(item_summaries)[compare_index];
                id(item_dues)[compare_index + 1]         = id(item_dues)[compare_index];
                id(item_descriptions)[compare_index + 1] = id(item_descriptions)[compare_index];
                compare_index--;
              }
              id(item_uids)[compare_index + 1]         = current_uid;
              id(item_summaries)[compare_index + 1]    = current_summary;
              id(item_dues)[compare_index + 1]         = current_due;
              id(item_descriptions)[compare_index + 1] = current_description;
            }

            // --- Auswahl im gültigen Bereich halten (z.B. nach Abhaken/Änderung der Liste) ---
            if (entry_total == 0) {
              id(selected_index) = 0;
            } else if (id(selected_index) >= entry_total) {
              id(selected_index) = entry_total - 1;
            }
        - delay: 1s
        - component.update: eink_display


binary_sensor:
  ## BOOT - button
  - platform: gpio
    pin: GPIO0
    name: "User button"
    id: user_button
    
  ## Jog -up
  - platform: template #gpio
    id: up
    #name: "up"
    ## either template with lambda and filter, or gpio with pin
    lambda: 'return gpio_get_level(GPIO_NUM_4) == 0;'
    filters:
      - delayed_on_off: 25ms
    #pin:
    #  number: GPIO4
    #  inverted: true
     # mode: INPUT_PULLUP
      #allow_other_uses: true
    on_press:
      then:
        - lambda: |-
            int cnt = (int) id(item_uids).size();
            if (cnt > 0) id(selected_index) = (id(selected_index) - 1 + cnt) % cnt;
        - component.update: eink_display
          
  ## Jog - push
  - platform: template #gpio
    id: push
    #name: "push"
    lambda: 'return gpio_get_level(GPIO_NUM_5) == 0;'
    filters:
      - delayed_on_off: 25ms
    #pin:
    #  number: GPIO5
    #  inverted: true
     # allow_other_uses: true
     # mode: INPUT_PULLUP
    on_multi_click:
      - timing:
          - ON for at least 3000ms
        then:
          - lambda: |-
              int cnt = (int) id(item_uids).size();
              if (cnt > 0 && id(selected_index) < cnt) {
                id(pending_uid) = id(item_uids)[id(selected_index)];
                id(confirmation_text) = id(item_summaries)[id(selected_index)];
                //id(confirmation_text) = id(item_summaries)[id(selected_index)] + "\n" + "entnommen";
               // id(confirmation_text) = "\\u221A" + " " + id(item_summaries)[id(selected_index)] + " " + "entnommen.";
              } else {
                id(pending_uid) = "";
              }
          - if:
              condition:
                lambda: 'return !id(pending_uid).empty();'
              then:
                - homeassistant.action:
                    action: todo.update_item
                    data:
                      entity_id: ${todo_entity}
                      item: !lambda 'return id(pending_uid);'
                      status: "completed"
                - lambda: 'id(confirmation_active) = true;'
                - component.update: eink_display
                - delay: 3s
                - lambda: 'id(confirmation_active) = false;'
                - component.update: eink_display
## alternative function
